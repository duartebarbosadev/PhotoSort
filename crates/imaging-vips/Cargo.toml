[package]
name = "photosort-imaging-vips"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
publish = false

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff"] }
moxcms = "0.8.1"
tempfile = "3"
jpeg-encoder = "0.7.1"
tiff = "0.11.3"

[profile.dev]
debug = "line-tables-only"
incremental = false
