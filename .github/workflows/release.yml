name: Release
# Run it from the Actions tab with a version (for example 3.0.1): it sets that version in
# Cargo.toml and Cargo.lock, commits and tags it on main, builds the macOS app and the
# Windows zip and creates a draft GitHub release for review. Leave the version empty for a
# test build, which keeps both as workflow artifacts and creates no commit, tag or release.
# Pushing a v* tag by hand still works; the tag must then match Cargo.toml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 3.0.1. Leave empty for a test build.
        required: false
        type: string
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  prepare:
    name: Set the version and tag
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Pushes the release commit to main and creates the tag.
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Keeps the token in .git/config on purpose: the step below pushes with it.
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Set the version, commit and tag
        id: tag
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 3.0.1, not '$REQUESTED'"
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi
          current="$(python3 -I -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          # The update checker never offers a downgrade, so neither may a release.
          python3 -I - "$current" "$version" <<'EOF'
          import sys
          current, wanted = (tuple(map(int, v.split("."))) for v in sys.argv[1:])
          if wanted < current:
              print(f"::error::Version {sys.argv[2]} is older than the current {sys.argv[1]}")
              sys.exit(1)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$version" != "$current" ]]; then
            # The first version line in Cargo.toml belongs to [package].
            python3 -I - "$version" <<'EOF'
          import re, sys
          from pathlib import Path
          path = Path("Cargo.toml")
          text, count = re.subn(r'(?m)^version = "[^"]*"', f'version = "{sys.argv[1]}"', path.read_text(), count=1)
          assert count == 1, "no package version in Cargo.toml"
          path.write_text(text)
          EOF
            cargo update --workspace
            git commit --all --message "Release $version"
          fi
          git tag --annotate "$tag" --message "PhotoSort $version"
          # The commit and the tag land together or not at all. Tags pushed with this
          # token start no other workflow, so this run builds the release itself.
          git push --atomic origin HEAD:main "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS app (Apple Silicon)
    needs: prepare
    # Runs after a successful prepare, or without it for test builds and pushed tags.
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    # Bundled Homebrew libraries require the macOS version their bottles were built
    # for, so this image sets the app's minimum macOS (the packager records it in
    # Info.plist and the release notes repeat it). Change it deliberately.
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      # Read by option_env! when the packager builds; enables update checks.
      PHOTOSORT_RELEASE_REPOSITORY: duartebarbosadev/PhotoSort
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      ORT_VERSION: 1.29.0
      # onnxruntime-osx-arm64-1.29.0.tgz; resources/SHA256SUMS pins the library inside.
      ORT_ARCHIVE_SHA256: d0706fc34f315d8c88639d0a8c81f2e09e815f282cabed3493c06a054352cf92
      # Prerelease holding the converted models (CONTRIBUTING.md#converted-models).
      MODELS_RELEASE: models-2
      # The tag this run releases: the one prepare created, or a pushed tag. Empty for a
      # test build.
      RELEASE_TAG: ${{ needs.prepare.outputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ env.RELEASE_TAG }}
      signing: ${{ steps.signing.outputs.mode }}
      minimum-macos: ${{ steps.app.outputs.minimum-macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check the version
        id: version
        run: |
          version="$(python3 -I -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match the Cargo.toml version $version"
            exit 1
          fi
          {
            echo "VERSION=$version"
            echo "ASSET=PhotoSort-$version-macos-arm64.zip"
          } >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Choose signing
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          count() {
            local set=0 value
            for value in "$@"; do
              if [[ -n "$value" ]]; then set=$((set + 1)); fi
            done
            echo "$set"
          }
          certificate="$(count "$MACOS_CERTIFICATE" "$MACOS_CERTIFICATE_PASSWORD")"
          notary="$(count "$APPLE_ID" "$APPLE_TEAM_ID" "$APPLE_APP_PASSWORD")"
          # A partial configuration is a mistake, not a request for a weaker build.
          if [[ "$certificate" == 1 ]]; then
            echo "::error::Set both MACOS_CERTIFICATE and MACOS_CERTIFICATE_PASSWORD, or neither"
            exit 1
          fi
          if [[ "$notary" != 0 && "$notary" != 3 ]]; then
            echo "::error::Set all of APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD, or none"
            exit 1
          fi
          if [[ "$notary" == 3 && "$certificate" == 0 ]]; then
            echo "::error::Notarization needs the Developer ID certificate secrets as well"
            exit 1
          fi
          if [[ "$notary" == 3 ]]; then
            mode=notarized
          elif [[ "$certificate" == 2 ]]; then
            mode=signed
          else
            mode=adhoc
            echo "::notice::No signing secrets; the app keeps its ad-hoc signature and is not notarized"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install native dependencies
        run: brew install libraw exiv2 pkg-config glib jpeg-turbo libpng libtiff little-cms2 highway
      - name: Build the private libvips engine
        run: |
          python3 -B scripts/build_vips.py
          # setup-python exports its own PKG_CONFIG_PATH, which would hide
          # the private engine from the build scripts that follow.
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/.tools/vips/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Test the packaging scripts
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Fetch ONNX Runtime
        run: |
          archive="$RUNNER_TEMP/onnxruntime.tgz"
          extracted="$RUNNER_TEMP/onnxruntime"
          curl --fail --location --proto '=https' --retry 3 --output "$archive" \
            "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-osx-arm64-$ORT_VERSION.tgz"
          echo "$ORT_ARCHIVE_SHA256  $archive" | shasum -a 256 --check
          mkdir "$extracted"
          tar -xzf "$archive" -C "$extracted" "onnxruntime-osx-arm64-$ORT_VERSION/lib/libonnxruntime.dylib"
          mkdir -p resources/runtime
          cp "$extracted/onnxruntime-osx-arm64-$ORT_VERSION/lib/libonnxruntime.dylib" resources/runtime/
      - uses: ./.github/actions/fetch-models
        with:
          models-release: ${{ env.MODELS_RELEASE }}
      - name: Verify resources against SHA256SUMS
        working-directory: resources
        # Every pinned file, including each downloaded model and the runtime.
        run: shasum -a 256 --check --strict SHA256SUMS
      # Build scripts and proc macros of every dependency run here, before the
      # signing identity is unlocked; the signed packaging below packages this
      # build with --no-build and never runs Cargo.
      - name: Build before the signing identity is available
        run: python3 -B scripts/package_macos.py --native-imaging --sign-identity -
      - name: Import the Developer ID certificate
        id: certificate
        if: steps.signing.outputs.mode != 'adhoc'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/photosort-signing.keychain-db"
          certificate="$RUNNER_TEMP/photosort-signing.p12"
          password="$(openssl rand -base64 24)"
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -f pkcs12 -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: / { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo "::error::MACOS_CERTIFICATE has no valid Developer ID Application identity"
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - name: Package the app
        env:
          SIGN_IDENTITY: ${{ steps.certificate.outputs.identity || '-' }}
        run: python3 -B scripts/package_macos.py --native-imaging --no-build --sign-identity "$SIGN_IDENTITY"
      - name: Check the app
        id: app
        # Outside the checkout, so the app cannot pick up ./resources instead of its own.
        working-directory: ${{ runner.temp }}
        run: |
          app="$GITHUB_WORKSPACE/target/PhotoSort.app"
          plist="$app/Contents/Info.plist"
          bundled="$(plutil -extract CFBundleShortVersionString raw "$plist")"
          if [[ "$bundled" != "$VERSION" ]]; then
            echo "::error::The bundle says $bundled, expected $VERSION"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p check-data check-cache
          PHOTOSORT_DATA_ROOT="$PWD/check-data" PHOTOSORT_CACHE_ROOT="$PWD/check-cache" \
            "$app/Contents/MacOS/photosort" --check-runtime > check-runtime.json
          # Every model and the runtime must come from the bundle itself.
          python3 -I - check-runtime.json "$app/Contents/Resources" <<'EOF'
          import json, os, sys
          report = json.load(open(sys.argv[1]))["diagnostics"]
          resources = os.path.realpath(sys.argv[2]) + os.sep
          paths = [report["runtime"]["path"]] + [model["path"] for model in report["models"]]
          outside = [path for path in paths if not os.path.realpath(path).startswith(resources)]
          sys.exit(f"Loaded from outside the bundle: {outside}" if outside else None)
          EOF
          echo "minimum-macos=$(plutil -extract LSMinimumSystemVersion raw "$plist")" >> "$GITHUB_OUTPUT"
      - name: Zip the app
        run: |
          mkdir dist
          ditto -c -k --keepParent target/PhotoSort.app "dist/$ASSET"
      - name: Notarize and staple
        if: steps.signing.outputs.mode == 'notarized'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          credentials=(--apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD")
          result="$RUNNER_TEMP/notarization.json"
          xcrun notarytool submit "dist/$ASSET" "${credentials[@]}" --wait --timeout 1h --output-format json > "$result" || true
          cat "$result"
          status="$(plutil -extract status raw "$result")"
          if [[ "$status" != Accepted ]]; then
            xcrun notarytool log "$(plutil -extract id raw "$result")" "${credentials[@]}" || true
            echo "::error::Notarization finished with status $status"
            exit 1
          fi
          xcrun stapler staple target/PhotoSort.app
          xcrun stapler validate target/PhotoSort.app
          spctl --assess --type execute --verbose=4 target/PhotoSort.app
          # Ship the stapled app, so first launch works offline.
          rm "dist/$ASSET"
          ditto -c -k --keepParent target/PhotoSort.app "dist/$ASSET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: photosort-macos-arm64
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.mode != 'adhoc'
        run: security delete-keychain "$RUNNER_TEMP/photosort-signing.keychain-db" || true

  windows:
    name: Windows zip (x64)
    needs: prepare
    # Runs after a successful prepare, or without it for test builds and pushed tags.
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    # The zip carries the Visual C++ runtime the build links, so the image only decides
    # the compiler. Change it deliberately.
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      # Read by option_env! when the release builds; enables update checks.
      PHOTOSORT_RELEASE_REPOSITORY: duartebarbosadev/PhotoSort
      ORT_VERSION: 1.29.0
      # onnxruntime-win-x64-1.29.0.zip, as src/core/model_assets/runtime.rs pins it.
      ORT_ARCHIVE_SHA256: c9b4b7086b529ad814f428c1bad028e20a25d7dc0699836775faace4ab5b78b2
      MODELS_RELEASE: models-2
      RELEASE_TAG: ${{ needs.prepare.outputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check the version
        id: version
        run: |
          version="$(python -I -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match the Cargo.toml version $version"
            exit 1
          fi
          {
            echo "VERSION=$version"
            echo "ASSET=PhotoSort-$version-windows-x64.zip"
          } >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/windows-native
      - name: Test the packaging scripts
        run: python -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Fetch ONNX Runtime
        # Only the two libraries PhotoSort loads, as Menu → AI models installs them.
        run: |
          curl --fail --location --proto '=https' --retry 3 --output "$RUNNER_TEMP/onnxruntime.zip" \
            "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-win-x64-$ORT_VERSION.zip"
          mkdir -p resources/runtime
          python -I - "$RUNNER_TEMP/onnxruntime.zip" resources/runtime <<'EOF'
          import hashlib, os, shutil, sys, zipfile
          archive, output = sys.argv[1:]
          digest = hashlib.sha256(open(archive, "rb").read()).hexdigest()
          if digest != os.environ["ORT_ARCHIVE_SHA256"]:
              sys.exit(f"ONNX Runtime archive SHA-256 {digest}, expected {os.environ['ORT_ARCHIVE_SHA256']}")
          folder = f"onnxruntime-win-x64-{os.environ['ORT_VERSION']}/lib/"
          with zipfile.ZipFile(archive) as source:
              for name in ("onnxruntime.dll", "onnxruntime_providers_shared.dll"):
                  with source.open(folder + name) as library, open(os.path.join(output, name), "wb") as copy:
                      shutil.copyfileobj(library, copy)
          EOF
      - uses: ./.github/actions/fetch-models
        with:
          models-release: ${{ env.MODELS_RELEASE }}
      - name: Verify the models against SHA256SUMS
        working-directory: resources
        # Its runtime pin is the macOS library; the archive check above covers Windows.
        run: grep -v '  runtime/' SHA256SUMS | sha256sum --check --strict -
      - name: Build and package
        run: python -B scripts/package_windows.py --zip "dist/$ASSET"
      - name: Build the media check
        # A test program, never shipped. Run from inside the unpacked zip, it decodes
        # media with the libraries the zip bundles.
        run: cargo build --release --locked --example verify_media
      - name: Make sample videos
        # With the installed GStreamer, before the check below hides it: one clip per
        # container and codec family the bundled plugins must play, most with sound.
        run: |
          launch="/c/Program Files/gstreamer/1.0/msvc_x86_64/bin/gst-launch-1.0.exe"
          video="videotestsrc num-buffers=45 ! video/x-raw,width=320,height=240,framerate=30/1"
          audio="audiotestsrc num-buffers=60 ! audioconvert ! audioresample"
          mkdir -p "$RUNNER_TEMP/videos"
          cd "$RUNNER_TEMP/videos"
          clip() {
            # gst-launch takes the pipeline as separate words.
            # shellcheck disable=SC2086
            "$launch" -q $2
            test -s "$1"
          }
          clip hevc.mov "$video ! x265enc ! h265parse ! qtmux name=mux ! filesink location=hevc.mov $audio ! avenc_aac ! mux."
          clip vp9.webm "$video ! vp9enc ! webmmux name=mux ! filesink location=vp9.webm $audio ! opusenc ! mux."
          clip h264.mkv "$video ! x264enc ! h264parse ! matroskamux name=mux ! filesink location=h264.mkv $audio ! vorbisenc ! mux."
          clip av1.mp4 "$video ! svtav1enc ! av1parse ! mp4mux name=mux ! filesink location=av1.mp4 $audio ! avenc_aac ! mux."
          clip mpeg2.mpg "$video ! avenc_mpeg2video ! mpegvideoparse ! mpegpsmux ! filesink location=mpeg2.mpg"
          # Silent: asfmux interleaves sound so that the player's preroll stalls on its
          # files, with any GStreamer; files from other muxers (ffmpeg) play.
          clip wmv.wmv "$video ! avenc_wmv2 ! asfmux ! filesink location=wmv.wmv"
          clip mjpeg.avi "$video ! jpegenc ! avimux ! filesink location=mjpeg.avi"
          ls -l
      - name: Check the zip
        # Outside the checkout, so nothing can come from ./resources, and with the
        # installed GStreamer moved away, so everything must come from the zip.
        working-directory: ${{ runner.temp }}
        run: |
          python -I -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall("check")' "$GITHUB_WORKSPACE/dist/$ASSET"
          app="$PWD/check/PhotoSort"
          mv "/c/Program Files/gstreamer" "/c/Program Files/gstreamer-hidden"
          unset GSTREAMER_1_0_ROOT_MSVC_X86_64
          mkdir -p check-data check-cache
          export PHOTOSORT_DATA_ROOT="$PWD/check-data" PHOTOSORT_CACHE_ROOT="$PWD/check-cache"
          bundled="$("$app/photosort.exe" --version)"
          if [[ "$bundled" != "PhotoSort $VERSION" ]]; then
            echo "::error::The executable says '$bundled', expected 'PhotoSort $VERSION'"
            exit 1
          fi
          "$app/photosort.exe" --check-runtime > check-runtime.json
          # Every model and the runtime must come from the zip itself.
          python -I - check-runtime.json "$app/resources" <<'EOF'
          import json, os, sys
          report = json.load(open(sys.argv[1]))["diagnostics"]
          resources = os.path.normcase(os.path.realpath(sys.argv[2])) + os.sep
          paths = [report["runtime"]["path"]] + [model["path"] for model in report["models"]]
          outside = [path for path in paths if not os.path.normcase(os.path.realpath(path)).startswith(resources)]
          sys.exit(f"Loaded from outside the zip: {outside}" if outside else None)
          EOF
          # RAW (LibRaw), HEIC (libheif) and video (the bundled GStreamer).
          cp "$GITHUB_WORKSPACE/target/release/examples/verify_media.exe" "$app/"
          "$app/verify_media.exe" \
            "$GITHUB_WORKSPACE/tests/samples/arw_sample.ARW" \
            "$GITHUB_WORKSPACE/tests/samples/GAB02000-min.png" \
            "$GITHUB_WORKSPACE/tests/fixtures/heif/portable/orientation-6.heic" \
            "$GITHUB_WORKSPACE/resources/intro/intro.mp4" \
            "$RUNNER_TEMP"/videos/*
          rm "$app/verify_media.exe"
          # Nothing was written into the folder.
          (cd "$app" && sha256sum --check --strict --quiet resources/BUNDLE-SHA256SUMS)
      - name: Write the checksum
        run: (cd dist && sha256sum "$ASSET" > "$ASSET.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: photosort-windows-x64
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  notes:
    name: Checksums and release notes
    needs: [macos, windows]
    if: always() && needs.macos.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.macos.outputs.version }}
      ORT_VERSION: 1.29.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.macos.outputs.tag || github.ref }}
          persist-credentials: false
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: photosort-*
          path: dist
          merge-multiple: true
      - name: Write checksums and release notes
        env:
          WINDOWS_VERSION: ${{ needs.windows.outputs.version }}
          SIGNING: ${{ needs.macos.outputs.signing }}
          MINIMUM_MACOS: ${{ needs.macos.outputs.minimum-macos }}
        run: |
          if [[ "$WINDOWS_VERSION" != "$VERSION" ]]; then
            echo "::error::The macOS build is $VERSION but the Windows build is $WINDOWS_VERSION"
            exit 1
          fi
          mac="PhotoSort-$VERSION-macos-arm64.zip"
          windows="PhotoSort-$VERSION-windows-x64.zip"
          checksums="PhotoSort-$VERSION-SHA256SUMS.txt"
          mkdir release
          # The Windows job hashed its zip where it built it; this checks the transfer.
          (cd dist && sha256sum --check --strict "$windows.sha256")
          (cd dist && sha256sum "$mac" "$windows") > "release/$checksums"
          mv "dist/$mac" "dist/$windows" release/
          python3 -I - .github/release-notes.md release/release-notes.md "release/$checksums" <<'EOF'
          import os, re, string, sys
          source, output, checksums = sys.argv[1:]
          text = open(source).read()
          # Keep the first-launch section that matches how the Mac app was signed.
          keep = "notarized" if os.environ["SIGNING"] == "notarized" else "not-notarized"
          text = re.sub(r"<!-- (notarized|not-notarized) -->\n(.*?)<!-- /\1 -->\n",
                        lambda m: m.group(2) if m.group(1) == keep else "", text, flags=re.S)
          # The app's update dialog shows notes as plain text, comments included.
          text = re.sub(r"<!--.*?-->\n?", "", text, flags=re.S)
          version = os.environ["VERSION"]
          values = dict(version=version, asset=f"PhotoSort-{version}-macos-arm64.zip",
                        windows_asset=f"PhotoSort-{version}-windows-x64.zip",
                        checksums=os.path.basename(checksums), sha256=open(checksums).read().strip(),
                        minimum_macos=os.environ["MINIMUM_MACOS"], onnxruntime=os.environ["ORT_VERSION"],
                        repository=os.environ["GITHUB_REPOSITORY"])
          open(output, "w").write(string.Template(text).substitute(values))
          EOF
          cat release/release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Draft GitHub release
    needs: [macos, notes]
    # Releases only; a test build stops at the workflow artifacts.
    if: always() && needs.notes.result == 'success' && needs.macos.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Creates the draft release and uploads its assets.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.macos.outputs.version }}
          TAG: ${{ needs.macos.outputs.tag }}
        run: |
          # Drafts do not own their tag, so a re-run would add a second draft.
          existing="$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == env.TAG) | .html_url')"
          if [[ -n "$existing" ]]; then
            echo "::error::A release for $TAG already exists ($existing); delete it before re-running"
            exit 1
          fi
          gh release create "$TAG" --draft --verify-tag --title "PhotoSort $VERSION" \
            --notes-file dist/release-notes.md \
            "dist/PhotoSort-$VERSION-macos-arm64.zip" "dist/PhotoSort-$VERSION-windows-x64.zip" \
            "dist/PhotoSort-$VERSION-SHA256SUMS.txt"
