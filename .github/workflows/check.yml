name: Rust checks
on:
  push:
    branches: [main]
    # Root-level Markdown only: test fixtures include Markdown files in the build.
    paths-ignore: ['*.md', 'LICENSE', '.github/FUNDING.yml']
  pull_request:
    paths-ignore: ['*.md', 'LICENSE', '.github/FUNDING.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push replaces a pull request's run. Runs on main always finish, since only
  # they save the build caches that pull requests reuse.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # nextest runs every test in one parallel pool, each in its own process. The crate
  # has no doctests, which nextest skips. Examples have no tests, so they are not
  # linked by it; clippy --all-targets still checks that they compile.
  macos:
    name: macOS
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: brew install libraw exiv2 pkg-config glib jpeg-turbo libpng libtiff little-cms2 highway
      # The private engine only changes with its build script or the libraries it builds
      # against, so reuse it until one of them does.
      - id: vips-key
        run: echo "key=vips-$ImageOS-$(python3 -B scripts/build_vips.py --cache-key)" >> "$GITHUB_OUTPUT"
      - id: vips-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/vips
          key: ${{ steps.vips-key.outputs.key }}
      - if: steps.vips-cache.outputs.cache-hit != 'true'
        run: python3 -B scripts/build_vips.py
      - run: |
          # setup-python exports its own PKG_CONFIG_PATH, which would hide
          # the private engine from the build scripts that follow.
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/.tools/vips/lib/pkgconfig" >> "$GITHUB_ENV"
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo nextest run --locked --lib --bins --tests --no-fail-fast
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked -p photosort-imaging-vips
  # The full build with the native stack from CONTRIBUTING.md: GStreamer from its
  # official installer, and Exiv2, LibRaw, libheif and libvips from vcpkg (about 25
  # minutes without the cache).
  windows:
    name: Windows
    timeout-minutes: 120
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: full
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: ./.github/actions/windows-native
      # The other packaging scripts are for macOS and Linux, whose jobs test them.
      - run: python -B -m unittest discover -s scripts -p 'test_package_windows.py'
      - run: cargo nextest run --locked --lib --bins --tests --no-fail-fast
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The adapter's own tests link GStreamer's GLib directly, without the app's delay-load.
      - run: |
          $env:PATH = "C:\Program Files\gstreamer\1.0\msvc_x86_64\bin;$env:PATH"
          cargo test --locked -p photosort-imaging-vips
          if ($LASTEXITCODE -ne 0) { throw 'adapter tests failed' }
  linux:
    name: Linux
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      # Debian's security repository supplies libheif >= 1.23, required by the Rust binding.
      image: rust:1.99.0-slim-trixie@sha256:2752b332db73fdbb7dc576f06c82ed1f312005784ef913d7e04a28f5f55dc581
    env:
      CARGO_HOME: /tmp/photosort-cargo
      CARGO_BUILD_JOBS: '4'
      PKG_CONFIG_PATH: /tmp/photosort-vips/lib/pkgconfig
      LD_LIBRARY_PATH: /tmp/photosort-vips/lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Restored as root before the ownership change below, so the unprivileged
      # build user can reuse and extend it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install native development dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config python3 python3-venv curl ca-certificates cmake ninja-build \
            libglib2.0-dev libexpat1-dev libjpeg-dev libpng-dev libtiff-dev liblcms2-dev libhwy-dev zlib1g-dev \
            libraw-dev libexiv2-dev libheif-dev libheif-plugin-libde265 \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libegl1-mesa-dev
          rustup component add clippy rustfmt
          useradd --create-home photosort
          mkdir -p "$CARGO_HOME"
          chown -R photosort:photosort "$GITHUB_WORKSPACE" "$CARGO_HOME"
      # Installed into CARGO_HOME, where cargo finds subcommands for the build user too.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest
      - id: vips-key
        run: echo "key=vips-debian-trixie-$(python3 -B scripts/build_vips.py --cache-key)" >> "$GITHUB_OUTPUT"
      - id: vips-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/photosort-vips
          key: ${{ steps.vips-key.outputs.key }}
      - run: runuser -u photosort -- python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Build the private image engine without root privileges
        if: steps.vips-cache.outputs.cache-hit != 'true'
        run: runuser -u photosort -- python3 -B scripts/build_vips.py --prefix /tmp/photosort-vips
      - run: runuser -u photosort -- cargo nextest run --locked --lib --bins --tests --no-fail-fast
      - run: runuser -u photosort -- cargo test --locked -p photosort-imaging-vips
      # Formatting does not depend on the platform; check it once.
      - run: runuser -u photosort -- cargo fmt --all --check
      - run: runuser -u photosort -- cargo clippy --locked --workspace --all-targets -- -D warnings
