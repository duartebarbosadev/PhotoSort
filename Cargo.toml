[package]
name = "photosort"
version = "3.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "A local-first desktop app for organizing and culling photo libraries"
authors = ["Duarte Barbosa"]
repository = "https://github.com/duartebarbosadev/PhotoSort"
readme = "README.md"
publish = false
# One integration test binary (tests/integration.rs lists the files) links much faster than one per file.
autotests = false

# Windows: `cargo vcpkg build` builds the native libraries into target/vcpkg, where
# build.rs and libheif-sys find them. Other platforms use pkg-config (see CONTRIBUTING.md).
[package.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg"
rev = "65886d79ccce671dc24ffbf9a348836beacb7f6f"
dependencies = [
    "exiv2[core,bmff,png,xmp]",
    "libraw[core,dng-lossy,openmp]",
    "libheif[core,libde265]",
]

[package.metadata.vcpkg.target]
x86_64-pc-windows-msvc = { triplet = "x64-windows-static-md" }

[dependencies]
photosort-imaging-vips = { path = "crates/imaging-vips", optional = true }
moxcms = "0.8.1"
# One bounded metadata cache owned by the shared imaging actor.
lru = { version = "0.18.5", default-features = false }
# Preserve original ink channels only for ICC-tagged CMYK JPEGs.
jpeg-decoder = { version = "0.3.2", default-features = false }
opener = { version = "0.9", features = ["reveal"] }
anyhow = "1.0"
semver = "1"
sha2 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "accesskit"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp", "gif"] }
kamadak-exif = "0.6"
# MIT. Reads MP4/MOV headers for video duration, frame rate and codec.
mp4 = "0.14"
# Page count only: lossless pixel rotation must refuse multi-page TIFF.
tiff = { version = "0.11.3", default-features = false }
rfd = "0.15.4"
# Icon font for icon-led controls (MIT); 0.14 matches egui 0.36.
egui-phosphor = "0.14"
serde = { version = "1", features = ["derive", "rc"] }
# Preserve measurement values exactly when evidence is reopened.
serde_json = { version = "1", features = ["float_roundtrip"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
walkdir = "2.5"
# Windows: plain C:\ paths for the clipboard and the terminal (already built for aws-lc-sys).
dunce = "1"
dirs = "6"
blake3 = "1.8"
trash = "5.2"
quick-xml = "0.41"
# zlib for compressed PNG text (XMP) carried through pixel rotation.
miniz_oxide = "0.9"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "coreml", "cuda", "directml"] }

tempfile = "3"
half = { version = "2.7", default-features = false, features = ["std"] }
rustfft = "6.4.1"
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
filedescriptor = "0.8.3"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry"] }
tracing-appender = { version = "0.2.5", default-features = false }

# Keep local development/test output modest across native/minimal feature builds.
# Tests inherit this profile; retain filename/line backtraces without full type data.
[profile.dev]
debug = "line-tables-only"
incremental = false

# Pixel work in dependencies (image, moxcms, half, miniz_oxide) is 10x+ slower
# unoptimized, which dominated test time. PhotoSort itself stays at opt-level 0.
[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.clippy]
all = "warn"

[features]
# Test and example builds only (via the dev-dependency below): application
# data and caches go to a per-process temporary folder, never the user's.
test-isolation = []
native-imaging = ["dep:photosort-imaging-vips"]

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[target.'cfg(windows)'.build-dependencies]
# Finds the libraries `cargo vcpkg build` installed; libheif-sys already uses it.
vcpkg = "0.2.15"

[target.'cfg(not(target_os = "macos"))'.dependencies]
gst = { package = "gstreamer", version = "0.24" }
gst_app = { package = "gstreamer-app", version = "0.24" }
gst_video = { package = "gstreamer-video", version = "0.24" }
libheif-rs = { version = "3.0", default-features = false, features = ["v1_23"] }

[target.'cfg(target_os = "macos")'.dependencies]
# mmap/munmap for image-sized buffers (see src/allocator.rs).
libc = "0.2"
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"] }

[target.'cfg(target_os = "windows")'.dependencies]
libc = "0.2"
# NTFS file identity (volume serial + file index); already used by walkdir.
winapi-util = "0.1.11"
# Copied photos: file list plus image formats in one clipboard write (already used by egui).
clipboard-win = { version = "5.4", features = ["std"] }
wgpu = { version = "30", default-features = false, features = ["dx12", "wgsl"] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
# statvfs for free disk space (see src/core/memory.rs).
libc = "0.2"
# Copied photos: file list plus image data in one clipboard offer. arboard
# (used by egui for text) writes one format at a time, so PhotoSort owns the
# selection itself: x11rb on X11 (already used by arboard and winit) and
# wl-clipboard-rs on Wayland compositors with data-control.
x11rb = "0.13.2"
wl-clipboard-rs = "0.9.4"

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan", "gles", "wgsl"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[dev-dependencies]
photosort = { path = ".", features = ["test-isolation"] }
jpeg-encoder = "0.7.1"
# Headless rendering for the UI screenshot gallery and visual checks.
egui_kittest = { version = "0.36.2", features = ["wgpu", "eframe"] }
