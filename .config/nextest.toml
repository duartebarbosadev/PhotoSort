# This test races 24 threads to replace one file. On Windows each writer retries a
# busy file for up to 5 s (src/core/replace.rs), and other test processes on a
# 4-core runner can starve a writer past that, so it runs on its own.
[[profile.default.overrides]]
filter = 'test(=atomic_writes::concurrent_atomic_writers_never_steal_or_remove_each_others_temporary_files)'
threads-required = "num-test-threads"
